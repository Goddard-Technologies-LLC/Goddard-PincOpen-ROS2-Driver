gripper:
  controller_manager:
    # Assumes a gripper prefix of 'pinc_open_' in launch file
    ros__parameters:
      update_rate: 50
      use_joint_limits: true

      pinc_open_driver_joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      pinc_open_driver_position_controller:
        type: position_controllers/JointGroupPositionController

      pinc_open_driver_trajectory_controller:
        type: joint_trajectory_controller/JointTrajectoryController

  pinc_open_driver_joint_state_broadcaster:
    ros__parameters:
        # Publish every available state interface. Joint position, velocity, and effort go to
        # joint_states; everything else (current, PWM, voltage, temperature) goes to
        # dynamic_joint_states.
        use_all_available_interfaces: true

  pinc_open_driver_position_controller:
    ros__parameters:
        joints:
          - pinc_open_gripper
        command_interfaces:
          - position
        state_interfaces:
          - position
          - velocity
        joint_limits:
          pinc_open_gripper:
            has_position_limits: true
            min_position: -2.653   # fully open (152 deg)
            max_position: 0.1745   # 10 deg past closed (tight grip)

  pinc_open_driver_trajectory_controller:
    ros__parameters:
      joints:
        - pinc_open_gripper
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity
      state_publish_rate: 50.0
      action_monitor_rate: 20.0
      constraints:
        goal_time: 1.0
        stopped_velocity_tolerance: 0.05
        pinc_open_gripper:
          trajectory: 0.1  # max allowed trajectory error
          goal: 0.1         # max allowed goal error

